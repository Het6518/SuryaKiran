services:
  backend:
    build: ./backend
    container_name: suryakiran-backend
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - PORT=5000
      - ML_SERVICE_URL=http://ml-service:5001
    depends_on:
      - ml-service
    networks:
      - suryakiran-net

  ml-service:
    image: python:3.11-slim
    container_name: suryakiran-ml-service
    working_dir: /app/services/ml
    volumes:
      - ./:/app
    env_file: .env
    environment:
      - ML_PORT=5001
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python app.py"
    ports:
      - "5001:5001"
    networks:
      - suryakiran-net

networks:
  suryakiran-net:
    driver: bridge
